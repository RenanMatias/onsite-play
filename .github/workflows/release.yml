# Builds the Foundry release when a GitHub release is published.
# Tag the release as v<version> (e.g. v1.0.0). The workflow writes that version and the matching
# download URL into module.json, zips the module, and attaches module.json + module.zip to the release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update module.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          jq --arg version "$VERSION" \
             --arg url "https://github.com/$REPO" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version = $version | .url = $url | .manifest = $manifest | .download = $download
              | .bugs = ($url + "/issues")
              | .readme = ($url + "/blob/main/README.md")
              | .changelog = ($url + "/blob/main/CHANGELOG.md")' \
             module.json > module.tmp && mv module.tmp module.json
          cat module.json

      - name: Build module.zip
        run: zip -r module.zip module.json README.md LICENSE CHANGELOG.md scripts templates styles lang

      - name: Attach files to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
